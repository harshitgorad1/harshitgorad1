<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartIoT — IoT Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #02020a;
            --surface: rgba(255, 255, 255, 0.035);
            --border: rgba(255, 255, 255, 0.08);
            --blue: #4facfe;
            --purple: #a855f7;
            --cyan: #00f2fe;
            --green: #43e97b;
            --red: #f5576c;
            --yellow: #fbbf24;
            --text: #e8e8f0;
            --muted: #6b6b88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 25% 25%, rgba(0, 242, 254, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 75%, rgba(168, 85, 247, 0.04) 0%, transparent 50%);
        }

        /* HEADER */
        header {
            padding: 14px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(2, 2, 10, 0.9);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .live-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(67, 233, 123, 0.12);
            border: 1px solid rgba(67, 233, 123, 0.3);
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .4;
                transform: scale(.7)
            }
        }

        .header-time {
            margin-left: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* LAYOUT */
        main {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* SENSOR CARDS */
        .sensor-card {
            grid-column: span 3;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: .3s;
        }

        .sensor-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent, rgba(79, 172, 254, 0.3));
        }

        .sensor-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .sensor-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .sensor-value {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
        }

        .sensor-unit {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--muted);
        }

        .sensor-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .sensor-bar {
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.06);
            margin-top: 12px;
            overflow: hidden;
        }

        .sensor-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 1s ease;
        }

        .sensor-glow {
            position: absolute;
            top: -40%;
            right: -20%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            opacity: .15;
            filter: blur(30px);
            pointer-events: none;
        }

        /* CHART CARDS */
        .chart-full {
            grid-column: span 8;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .chart-half {
            grid-column: span 4;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .chart-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .chart-sub {
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .chart-wrap {
            position: relative;
            height: 200px;
        }

        /* DEVICES */
        .devices-card {
            grid-column: span 4;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .device-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            transition: .2s;
            cursor: pointer;
        }

        .device-item:hover {
            border-color: rgba(79, 172, 254, 0.2);
            background: rgba(79, 172, 254, 0.03);
        }

        .device-icon {
            font-size: 1.4rem;
        }

        .device-name {
            font-size: 0.82rem;
            font-weight: 600;
            flex: 1;
        }

        .device-loc {
            font-size: 0.68rem;
            color: var(--muted);
        }

        .toggle {
            width: 40px;
            height: 22px;
            border-radius: 11px;
            border: none;
            cursor: pointer;
            transition: .3s;
            position: relative;
        }

        .toggle.on {
            background: linear-gradient(135deg, var(--green), var(--cyan));
        }

        .toggle.off {
            background: rgba(255, 255, 255, 0.08);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            top: 3px;
            transition: .3s;
        }

        .toggle.on::after {
            left: 21px;
        }

        .toggle.off::after {
            left: 3px;
        }

        /* ALERTS */
        .alerts-card {
            grid-column: span 8;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            border-left: 3px solid;
        }

        .alert-item.warning {
            background: rgba(251, 191, 36, 0.05);
            border-color: var(--yellow);
        }

        .alert-item.info {
            background: rgba(79, 172, 254, 0.05);
            border-color: var(--blue);
        }

        .alert-item.success {
            background: rgba(67, 233, 123, 0.05);
            border-color: var(--green);
        }

        .alert-time {
            font-family: 'Fira Code', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            white-space: nowrap;
            margin-top: 2px;
        }

        @media(max-width:900px) {
            .sensor-card {
                grid-column: span 6;
            }

            .chart-full,
            .chart-half,
            .devices-card,
            .alerts-card {
                grid-column: span 12;
            }
        }

        @media(max-width:550px) {
            .sensor-card {
                grid-column: span 12;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <span class="logo">⚡ SmartIoT</span>
        </div>
        <div class="live-badge">
            <div class="live-dot"></div>Live Monitoring
        </div>
        <div class="header-time" id="clockEl"></div>
    </header>

    <main>

        <!-- Sensor Cards -->
        <div class="sensor-card" style="--accent:rgba(0,242,254,0.3)">
            <div class="sensor-glow" style="background:var(--cyan)"></div>
            <div class="sensor-icon">🌡️</div>
            <div class="sensor-label">Temperature</div>
            <div class="sensor-value" id="sv-temp">--<span class="sensor-unit">°C</span></div>
            <div class="sensor-status"><span style="color:var(--green)">●</span> Normal range</div>
            <div class="sensor-bar">
                <div class="sensor-bar-fill" id="sb-temp"
                    style="background:linear-gradient(90deg,var(--cyan),var(--blue));width:0%"></div>
            </div>
        </div>

        <div class="sensor-card" style="--accent:rgba(79,172,254,0.3)">
            <div class="sensor-glow" style="background:var(--blue)"></div>
            <div class="sensor-icon">💧</div>
            <div class="sensor-label">Humidity</div>
            <div class="sensor-value" id="sv-hum">--<span class="sensor-unit">%</span></div>
            <div class="sensor-status"><span style="color:var(--green)">●</span> Optimal</div>
            <div class="sensor-bar">
                <div class="sensor-bar-fill" id="sb-hum"
                    style="background:linear-gradient(90deg,var(--blue),var(--purple));width:0%"></div>
            </div>
        </div>

        <div class="sensor-card" style="--accent:rgba(168,85,247,0.3)">
            <div class="sensor-glow" style="background:var(--purple)"></div>
            <div class="sensor-icon">⚡</div>
            <div class="sensor-label">Power Usage</div>
            <div class="sensor-value" id="sv-power">--<span class="sensor-unit">W</span></div>
            <div class="sensor-status"><span style="color:var(--yellow)">●</span> Moderate</div>
            <div class="sensor-bar">
                <div class="sensor-bar-fill" id="sb-power"
                    style="background:linear-gradient(90deg,var(--purple),#f093fb);width:0%"></div>
            </div>
        </div>

        <div class="sensor-card" style="--accent:rgba(67,233,123,0.3)">
            <div class="sensor-glow" style="background:var(--green)"></div>
            <div class="sensor-icon">📡</div>
            <div class="sensor-label">Network</div>
            <div class="sensor-value" id="sv-net">--<span class="sensor-unit">ms</span></div>
            <div class="sensor-status"><span style="color:var(--green)">●</span> Connected</div>
            <div class="sensor-bar">
                <div class="sensor-bar-fill" id="sb-net"
                    style="background:linear-gradient(90deg,var(--green),var(--cyan));width:0%"></div>
            </div>
        </div>

        <!-- Line chart -->
        <div class="chart-full">
            <div class="chart-title">Sensor History — Last 30 Minutes</div>
            <div class="chart-sub">Temperature and humidity trend (live updating)</div>
            <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
        </div>

        <!-- Radar / gauge -->
        <div class="chart-half">
            <div class="chart-title">System Health</div>
            <div class="chart-sub">Subsystem performance scores</div>
            <div class="chart-wrap"><canvas id="radarChart"></canvas></div>
        </div>

        <!-- Devices -->
        <div class="devices-card">
            <div class="chart-title" style="margin-bottom:16px">Smart Devices</div>
            <div id="deviceList"></div>
        </div>

        <!-- Alerts -->
        <div class="alerts-card">
            <div class="chart-title" style="margin-bottom:16px">Recent Alerts</div>
            <div id="alertsList"></div>
        </div>

    </main>

    <script>
        // Clock
        function updateClock() {
            document.getElementById('clockEl').textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
        }
        updateClock(); setInterval(updateClock, 1000);

        // Chart defaults
        Chart.defaults.color = '#6b6b88'; Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';

        // Line chart data
        const labels = Array.from({ length: 30 }, (_, i) => `${30 - i}m`).reverse();
        const tempData = Array.from({ length: 30 }, () => 20 + Math.random() * 8);
        const humData = Array.from({ length: 30 }, () => 50 + Math.random() * 20);

        const lineChart = new Chart(document.getElementById('lineChart'), {
            type: 'line',
            data: {
                labels, datasets: [
                    { label: 'Temperature (°C)', data: [...tempData], borderColor: '#00f2fe', backgroundColor: 'rgba(0,242,254,0.06)', borderWidth: 2, fill: true, tension: .4, pointRadius: 0 },
                    { label: 'Humidity (%)', data: [...humData], borderColor: '#a855f7', backgroundColor: 'rgba(168,85,247,0.06)', borderWidth: 2, fill: true, tension: .4, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: { duration: 0 },
                plugins: { legend: { labels: { font: { size: 11 } } } },
                scales: { x: { grid: { color: 'rgba(255,255,255,0.04)' } }, y: { grid: { color: 'rgba(255,255,255,0.04)' }, min: 10, max: 90 } }
            }
        });

        // Radar
        new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels: ['CPU', 'Memory', 'Network', 'Storage', 'Security', 'Uptime'],
                datasets: [{
                    label: 'Health %', data: [92, 78, 96, 85, 99, 100],
                    borderColor: '#4facfe', backgroundColor: 'rgba(79,172,254,0.1)', borderWidth: 2, pointBackgroundColor: '#4facfe'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    r: {
                        grid: { color: 'rgba(255,255,255,0.06)' }, pointLabels: { color: '#6b6b88', font: { size: 10 } },
                        ticks: { display: false }, min: 0, max: 100
                    }
                }
            }
        });

        // Devices
        const devices = [
            { icon: '💡', name: 'Living Room Light', loc: 'Living Room', on: true },
            { icon: '🌡️', name: 'Smart Thermostat', loc: 'Hallway', on: true },
            { icon: '🔒', name: 'Front Door Lock', loc: 'Entrance', on: true },
            { icon: '📷', name: 'Security Camera', loc: 'Backyard', on: true },
            { icon: '🎵', name: 'Smart Speaker', loc: 'Kitchen', on: false },
            { icon: '🌬️', name: 'Air Purifier', loc: 'Bedroom', on: false },
        ];
        function renderDevices() {
            document.getElementById('deviceList').innerHTML = devices.map((d, i) => `
    <div class="device-item">
      <span class="device-icon">${d.icon}</span>
      <div><div class="device-name">${d.name}</div><div class="device-loc">📍 ${d.loc}</div></div>
      <button class="toggle ${d.on ? 'on' : 'off'}" onclick="toggleDev(${i})" title="${d.on ? 'Turn Off' : 'Turn On'}"></button>
    </div>`).join('');
        }
        function toggleDev(i) { devices[i].on = !devices[i].on; renderDevices(); }
        renderDevices();

        // Alerts
        const alerts = [
            { type: 'warning', icon: '⚠️', msg: 'Temperature in Server Room reached 28°C — approaching threshold of 30°C', time: '2 min ago' },
            { type: 'success', icon: '✅', msg: 'Automated backup completed successfully — 3.2GB synced to cloud', time: '8 min ago' },
            { type: 'info', icon: 'ℹ️', msg: 'Firmware update available for Smart Thermostat v2.1 → v2.3', time: '15 min ago' },
            { type: 'success', icon: '✅', msg: 'Motion detected at front door — visitor identified (non-threat)', time: '22 min ago' },
            { type: 'warning', icon: '⚠️', msg: 'Power consumption spike detected — 15% above daily average', time: '1 hr ago' },
        ];
        document.getElementById('alertsList').innerHTML = alerts.map(a => `
  <div class="alert-item ${a.type}">
    <span>${a.icon}</span>
    <div><div>${a.msg}</div><div class="alert-time">${a.time}</div></div>
  </div>`).join('');

        // Live sensor update
        function updateSensors() {
            const temp = (20 + Math.random() * 8).toFixed(1);
            const hum = (50 + Math.random() * 20).toFixed(1);
            const power = (180 + Math.random() * 120).toFixed(0);
            const net = (8 + Math.random() * 25).toFixed(0);

            document.getElementById('sv-temp').innerHTML = `${temp}<span class="sensor-unit">°C</span>`;
            document.getElementById('sv-hum').innerHTML = `${hum}<span class="sensor-unit">%</span>`;
            document.getElementById('sv-power').innerHTML = `${power}<span class="sensor-unit">W</span>`;
            document.getElementById('sv-net').innerHTML = `${net}<span class="sensor-unit">ms</span>`;

            document.getElementById('sb-temp').style.width = ((temp - 20) / 8 * 100) + '%';
            document.getElementById('sb-hum').style.width = ((hum - 50) / 30 * 100) + '%';
            document.getElementById('sb-power').style.width = ((power - 180) / 120 * 100) + '%';
            document.getElementById('sb-net').style.width = Math.max(5, 100 - (net / 50 * 100)) + '%';

            // Push to chart
            lineChart.data.labels.shift(); lineChart.data.labels.push('now');
            lineChart.data.datasets[0].data.shift(); lineChart.data.datasets[0].data.push(parseFloat(temp));
            lineChart.data.datasets[1].data.shift(); lineChart.data.datasets[1].data.push(parseFloat(hum));
            lineChart.update('none');
        }
        updateSensors();
        setInterval(updateSensors, 2500);
    </script>
</body>

</html>
