<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #02020a;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --blue: #4facfe;
            --purple: #a855f7;
            --cyan: #00f2fe;
            --text: #e8e8f0;
            --muted: #6b6b88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1rem;
            font-weight: 700;
        }

        header p {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43e97b;
            margin-left: auto;
            box-shadow: 0 0 8px #43e97b;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        /* Chat area */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--purple) var(--bg);
        }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 75%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .msg.ai .msg-avatar {
            background: linear-gradient(135deg, var(--blue), var(--purple));
        }

        .msg.user .msg-avatar {
            background: linear-gradient(135deg, var(--purple), #f093fb);
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .msg.ai .msg-bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg.user .msg-bubble {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .msg.user .msg-time {
            text-align: right;
        }

        /* Code block in chat */
        .code-block {
            background: #0d0d1a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            margin-top: 8px;
            color: var(--cyan);
            overflow-x: auto;
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 7px;
            height: 7px;
            background: var(--blue);
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .2s
        }

        .typing span:nth-child(3) {
            animation-delay: .4s
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-6px)
            }
        }

        /* Input */
        #inputArea {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: rgba(10, 10, 26, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        #msgInput {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.3s;
        }

        #msgInput:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        #msgInput::placeholder {
            color: var(--muted);
        }

        #sendBtn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        #sendBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 20px rgba(79, 172, 254, 0.4);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        /* Suggestions */
        #suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 24px 12px;
        }

        .sug-btn {
            padding: 6px 14px;
            font-size: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .sug-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
            background: rgba(79, 172, 254, 0.05);
        }

        /* Gradient BG */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(79, 172, 254, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
        }
    </style>
</head>

<body>

    <header>
        <div class="avatar">🤖</div>
        <div>
            <h1>AI Chat Assistant</h1>
            <p>Powered by Advanced NLP</p>
        </div>
        <div class="status"></div>
    </header>

    <div id="chat"></div>

    <div id="suggestions">
        <button class="sug-btn" onclick="quickSend('What can you do?')">What can you do?</button>
        <button class="sug-btn" onclick="quickSend('Explain machine learning')">Explain ML</button>
        <button class="sug-btn" onclick="quickSend('Write Python code to sort a list')">Python code example</button>
        <button class="sug-btn" onclick="quickSend('Tell me about React.js')">About React.js</button>
        <button class="sug-btn" onclick="quickSend('What is NLP?')">What is NLP?</button>
    </div>

    <div id="inputArea">
        <input type="text" id="msgInput" placeholder="Ask me anything..." />
        <button id="sendBtn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
        </button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('msgInput');

        const RESPONSES = {
            default: ["That's a great question! Let me think about that...", "I can help with that! Could you provide more details?", "Interesting! Based on my training data, I can tell you that this is a complex topic that involves multiple considerations."],
            greet: ["Hello! 👋 I'm your AI assistant. I can help you with coding, explanations, and much more! What would you like to explore today?", "Hi there! Great to meet you. I'm powered by advanced NLP models and ready to assist!"],
            ml: [
                "**Machine Learning (ML)** is a subset of AI that enables systems to learn from data.\n\nKey types:\n• **Supervised Learning** — labeled training data\n• **Unsupervised Learning** — finds patterns in unlabeled data\n• **Reinforcement Learning** — learns through rewards\n\nPopular frameworks: TensorFlow, PyTorch, Scikit-learn"
            ],
            python: [
                "Here's a Python example to sort a list:\n```\n# Multiple ways to sort in Python\n\nnumbers = [5, 2, 8, 1, 9, 3]\n\n# Built-in sort (in-place)\nnumbers.sort()\n# → [1, 2, 3, 5, 8, 9]\n\n# sorted() returns new list\nsorted_nums = sorted(numbers, reverse=True)\n# → [9, 8, 5, 3, 2, 1]\n\n# Custom sort key\nwords = ['banana', 'apple', 'cherry']\nwords.sort(key=lambda x: len(x))\n```\nWant me to explain any part of this?"
            ],
            react: [
                "**React.js** is a JavaScript library for building user interfaces, developed by Meta.\n\nCore concepts:\n• **Components** — reusable UI building blocks\n• **JSX** — HTML-like syntax in JavaScript\n• **State & Props** — data flow management\n• **Hooks** — useState, useEffect, useMemo\n• **Virtual DOM** — efficient rendering\n\nReact is used by companies like Meta, Netflix, Airbnb, and Discord."
            ],
            nlp: [
                "**Natural Language Processing (NLP)** is a field of AI that enables computers to understand human language.\n\nCore tasks:\n• **Tokenization** — splitting text into words/sentences\n• **Sentiment Analysis** — detecting emotion in text\n• **Named Entity Recognition (NER)**\n• **Machine Translation**\n• **Text Generation** (like this AI!)\n\nPopular tools: NLTK, spaCy, Hugging Face Transformers"
            ],
            capabilities: [
                "I can help you with:\n\n🧠 **AI & Machine Learning** — explain concepts, architectures, tools\n💻 **Programming** — Python, JavaScript, React, Node.js, and more\n📊 **Data Analysis** — understanding datasets, visualizations\n🔍 **Research** — summarizing topics, answering questions\n✍️ **Writing** — help draft emails, docs, README files\n\nJust ask me anything!"
            ]
        };

        function getResponse(msg) {
            const m = msg.toLowerCase();
            if (m.match(/^(hi|hello|hey|howdy)/)) return rand(RESPONSES.greet);
            if (m.includes('machine learning') || m.includes(' ml') || m.match(/^ml/)) return rand(RESPONSES.ml);
            if (m.includes('python') || m.includes('sort') || m.includes('code')) return RESPONSES.python[0];
            if (m.includes('react')) return rand(RESPONSES.react);
            if (m.includes('nlp') || m.includes('natural language')) return rand(RESPONSES.nlp);
            if (m.includes('can you') || m.includes('what do') || m.includes('capabilities')) return rand(RESPONSES.capabilities);
            return rand(RESPONSES.default);
        }
        function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function now() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addMsg(text, role) {
            const wrap = document.createElement('div');
            wrap.className = `msg ${role}`;

            // Parse markdown-ish bold, code block
            let html = text
                .replace(/```([\s\S]*?)```/g, '<div class="code-block">$1</div>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            wrap.innerHTML = `
    <div class="msg-avatar">${role === 'ai' ? '🤖' : '👤'}</div>
    <div>
      <div class="msg-bubble">${html}</div>
      <div class="msg-time">${now()}</div>
    </div>`;
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
        }

        function showTyping() {
            const t = document.createElement('div');
            t.id = 'typing-indicator';
            t.className = 'msg ai';
            t.innerHTML = `<div class="msg-avatar">🤖</div><div class="typing"><span></span><span></span><span></span></div>`;
            chat.appendChild(t);
            chat.scrollTop = chat.scrollHeight;
            return t;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMsg(text, 'user');
            const typing = showTyping();
            const delay = 800 + Math.random() * 1000;
            await new Promise(r => setTimeout(r, delay));
            typing.remove();
            addMsg(getResponse(text), 'ai');
        }

        function quickSend(text) {
            input.value = text;
            sendMessage();
        }

        input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

        // Welcome message
        setTimeout(() => addMsg("Hello! 👋 I'm your AI assistant powered by NLP. Ask me about machine learning, programming, or anything else!", 'ai'), 400);
    </script>
</body>

</html>
